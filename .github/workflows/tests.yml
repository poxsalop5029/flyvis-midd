name: Lightweight contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis]"
      - name: Verify FlyVis is not installed
        run: python -c "import importlib.util; assert importlib.util.find_spec('flyvis') is None"
      - name: Run lightweight tests
        run: python -m unittest discover -s tests -v
